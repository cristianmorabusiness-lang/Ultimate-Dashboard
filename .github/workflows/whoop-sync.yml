name: WHOOP Daily Sync

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC — after WHOOP day closes
  workflow_dispatch:        # manual trigger for testing/backfill

permissions:
  contents: read
  # Required for the secret-update step
  # Set this in your repo: Settings > Actions > General > Workflow permissions > Read and write
  secrets: inherit

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run WHOOP sync
        working-directory: scripts
        env:
          WHOOP_CLIENT_ID:           ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET:       ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN:       ${{ secrets.WHOOP_REFRESH_TOKEN }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node whoop-sync.js

      - name: Rotate refresh token secret
        if: ${{ env.NEW_REFRESH_TOKEN != '' }}
        uses: gliech/create-github-secret-action@v1
        with:
          name: WHOOP_REFRESH_TOKEN
          value: ${{ env.NEW_REFRESH_TOKEN }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          # PERSONAL_ACCESS_TOKEN must have repo:secrets write scope
          # Create at: GitHub > Settings > Developer settings > Personal access tokens
