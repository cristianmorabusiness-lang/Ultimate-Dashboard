name: WHOOP Daily Sync

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC / 10:00 Italy — after morning wake-up
  workflow_dispatch:        # manual trigger for testing/backfill

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run WHOOP sync
        working-directory: scripts
        env:
          WHOOP_CLIENT_ID:           ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET:       ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN:       ${{ secrets.WHOOP_REFRESH_TOKEN }}
          WHOOP_REDIRECT_URI:        ${{ secrets.WHOOP_REDIRECT_URI }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node whoop-sync.js
